[package]
name = "kkitut-org"
version = "0.1.0"
edition = "2024"

[dependencies]
leptos = { version = "0.9.0-rc1", features = ["csr"] }
leptos_router = "0.9.0-rc1"
pulldown-cmark = "0.13.4"
web-sys = { version = "0.3.104", features = [
    "Element",
    "DomRect",
    "NodeList",
    "Window",
    "History",
    "KeyboardEvent",
    "MouseEvent",
    "ScrollToOptions",
    "ScrollBehavior",
] }
wasm-bindgen = "0.2.127"

[build-dependencies]
pulldown-cmark = "0.13.4"
